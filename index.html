<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#fff;--ink:#14201b;--muted:#53645c;--green:#006a4e;--deep:#004d38;--tint:#eaf4ef;--line:#c9ddd2;--gold:#f2b134;--err:#b42318;--dome:#12372a;--branch:#f4f1e8;
--font:Arial,"Helvetica Neue",sans-serif;--display:"Bricolage Grotesque",Arial,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5}
[hidden]{display:none!important}
button,input{font:inherit}

/* Intro */
#intro{position:relative;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;display:flex;flex-direction:column;align-items:center;font-family:var(--display)}
#intro .title{text-align:center;padding:clamp(24px,6vh,64px) 24px 0;animation:fade 1s ease-out .2s both;position:relative;z-index:2}
#intro h1{margin:0;font-weight:800;font-size:clamp(2.4rem,8vw,5.6rem);line-height:1;letter-spacing:-.03em}
#intro .title p{margin:12px 0 0;font-size:clamp(1rem,2vw,1.25rem);color:var(--muted)}
#enter{margin-top:18px;background:var(--green);color:#fff;border:0;border-radius:4px;padding:12px 28px;font:700 1rem var(--font);cursor:pointer;opacity:0;animation:fade .7s ease-out 3.8s forwards}
#enter:hover{background:var(--deep)}
.dome{position:absolute;bottom:0;left:50%;width:min(94vw,100vh);aspect-ratio:2/1;margin-left:calc(min(94vw,100vh)/-2);background:var(--dome);border-radius:9999px 9999px 0 0;transform:translateY(100%);animation:rise 1.8s cubic-bezier(.2,.7,.2,1) .5s forwards}
.tree{position:absolute;left:50%;bottom:0;height:84%;aspect-ratio:1;transform:translateX(-50%);overflow:visible}
.tree path{fill:none;stroke:var(--branch);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.1s ease-out forwards;animation-delay:calc(2.1s + var(--d,0s))}
.tree .t{stroke-width:5}.tree .b1{stroke-width:3.2}.tree .b2{stroke-width:2.2}
.tree circle{fill:var(--gold);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(3.1s + var(--d,0s))}
@keyframes rise{to{transform:none}}@keyframes grow{to{stroke-dashoffset:0}}@keyframes pop{to{transform:scale(1)}}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Portal */
.bar{background:var(--green);color:#fff;border-bottom:4px solid var(--gold)}
.bar>div{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.bar svg{width:46px;height:46px;flex:none}
.back{background:none;border:2px solid #fff;color:#fff;border-radius:3px;width:40px;height:40px;font-size:1.3rem;line-height:1;cursor:pointer;flex:none}
.back:hover{background:var(--deep)}
.bar strong{display:block;font-size:1.2rem}
.bar span{font-size:.85rem;opacity:.9}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 40px;min-height:60vh}
.foot{background:var(--tint);border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;text-align:center;padding:14px 20px}
.flash{max-width:440px;margin:0 auto 16px;background:var(--tint);border-left:4px solid var(--green);padding:10px 14px}
.ph{margin:0 0 6px;font-size:1.5rem;color:var(--deep)}
.pick{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:20px}
.opt{text-align:left;background:#fff;border:1px solid var(--line);border-left:6px solid var(--green);border-radius:4px;padding:20px;cursor:pointer;color:var(--ink)}
.opt:hover{background:var(--tint)}
.opt b{display:block;font-size:1.15rem;color:var(--deep)}
.opt span{color:var(--muted);font-size:.95rem}
.card{max-width:440px;margin:0 auto;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.card h1{margin:0;background:var(--green);color:#fff;font-size:1.15rem;padding:12px 20px}
.card .body{padding:20px}
.card p{margin:0 0 12px}
label{display:block;font-weight:700;font-size:.92rem;margin-bottom:14px}
input{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid #6f8f80;border-radius:3px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn{width:100%;background:var(--green);color:#fff;border:0;border-radius:3px;padding:11px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--deep)}
.lnk{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;cursor:pointer;font-size:.92rem}
.links{display:flex;justify-content:space-between;gap:12px;margin:14px 0 0!important}
.err{color:var(--err);font-weight:700;font-size:.9rem;min-height:1.3em}
.note{background:var(--tint);padding:8px 10px;border-radius:3px;font-size:.9rem}
.sub{color:var(--muted);font-size:.9rem}

@media (prefers-reduced-motion:reduce){#intro .title,.dome,.tree path,.tree circle,#enter{animation:none}.dome{transform:none}.tree path{stroke-dashoffset:0}.tree circle{transform:none}#enter{opacity:1}}
</style>
</head>
<body>

<section id="intro">
  <div class="title">
    <h1>Safe Land</h1>
    <p>Dates and venue coming soon</p>
    <button id="enter" type="button">Enter portal</button>
  </div>
  <div class="dome" role="img" aria-label="A tree growing inside a half circle">
    <svg class="tree" viewBox="0 0 200 200" aria-hidden="true">
      <path class="t" pathLength="1" d="M100 200 V118"/>
      <path class="b1" pathLength="1" d="M100 150 C100 135 80 128 62 112" style="--d:.2s"/>
      <path class="b1" pathLength="1" d="M100 140 C100 128 120 122 138 104" style="--d:.3s"/>
      <path class="b1" pathLength="1" d="M100 118 C100 100 100 80 100 56" style="--d:.4s"/>
      <path class="b2" pathLength="1" d="M100 100 C88 90 78 84 70 68" style="--d:.6s"/>
      <path class="b2" pathLength="1" d="M100 96 C112 86 124 78 130 62" style="--d:.65s"/>
      <path class="b2" pathLength="1" d="M62 112 C54 110 48 106 40 98" style="--d:.55s"/>
      <path class="b2" pathLength="1" d="M62 112 C60 100 56 92 54 82" style="--d:.6s"/>
      <path class="b2" pathLength="1" d="M138 104 C146 100 152 94 160 86" style="--d:.6s"/>
      <path class="b2" pathLength="1" d="M138 104 C140 94 142 86 144 76" style="--d:.65s"/>
      <path class="b2" pathLength="1" d="M100 56 C96 48 94 42 92 34" style="--d:.75s"/>
      <path class="b2" pathLength="1" d="M100 56 C104 48 106 42 110 36" style="--d:.8s"/>
      <circle cx="70" cy="68" r="3.6" style="--d:.05s"/><circle cx="130" cy="62" r="3.6" style="--d:.1s"/>
      <circle cx="40" cy="98" r="3.6" style="--d:.15s"/><circle cx="54" cy="82" r="3.6" style="--d:.2s"/>
      <circle cx="160" cy="86" r="3.6" style="--d:.25s"/><circle cx="144" cy="76" r="3.6" style="--d:.3s"/>
      <circle cx="92" cy="34" r="3.6" style="--d:.35s"/><circle cx="110" cy="36" r="3.6" style="--d:.4s"/>
    </svg>
  </div>
</section>

<div id="portal" hidden>
  <header class="bar"><div>
    <button type="button" class="back" id="back" aria-label="Back to previous page" title="Back">&larr;</button>
    <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#fff"/><path d="M8 33a14 14 0 0 1 28 0z" fill="#006a4e"/><path d="M22 33V20M22 28l-5-5M22 25l5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    <div><strong>Safe Land</strong><span>Participant and officer portal</span></div>
  </div></header>

  <main class="wrap">
    <div id="flash" class="flash" role="status" hidden></div>

    <section data-v="choose" hidden>
      <h1 class="ph">Select login type</h1>
      <p class="sub">Choose how you want to sign in.</p>
      <div class="pick">
        <button class="opt" type="button" data-go="user"><b>User login</b><span>For hackathon participants</span></button>
        <button class="opt" type="button" data-go="corp"><b>Corporate officer login</b><span>For organisation and sponsor officers</span></button>
      </div>
    </section>

    <section data-v="user" class="card" hidden>
      <h1>User login</h1>
      <form id="fUser" class="body" novalidate>
        <label>ID (NID number)<input id="uId" inputmode="numeric" autocomplete="username"></label>
        <label>Password<input id="uPw" type="password" autocomplete="current-password"></label>
        <p class="err" role="alert"></p>
        <button class="btn">Log in</button>
        <p class="links"><button type="button" class="lnk" data-go="signup">Create account</button><button type="button" class="lnk" data-go="forgot">Forgot password?</button></p>
      </form>
    </section>

    <section data-v="signup" class="card" hidden>
      <h1>Create account</h1>
      <form id="fSign" class="body" novalidate>
        <label>First name<input id="sF" autocomplete="given-name"></label>
        <label>Last name<input id="sL" autocomplete="family-name"></label>
        <label>NID card number<input id="sN" inputmode="numeric"></label>
        <label>Phone number<input id="sP" type="tel" autocomplete="tel"></label>
        <label>Password (at least 8 characters)<input id="sW" type="password" autocomplete="new-password"></label>
        <label>Confirm password<input id="sW2" type="password" autocomplete="new-password"></label>
        <p class="err" role="alert"></p>
        <button class="btn">Send OTP</button>
      </form>
    </section>

    <section data-v="corp" class="card" hidden>
      <h1>Corporate login</h1>
      <form id="fCorp" class="body" novalidate>
        <label>ID<input id="cId" autocomplete="username"></label>
        <label>Password<input id="cPw" type="password" autocomplete="current-password"></label>
        <p class="err" role="alert"></p>
        <button class="btn">Log in</button>
      </form>
    </section>

    <section data-v="otp" class="card" hidden>
      <h1>OTP verification</h1>
      <form id="fOtp" class="body" novalidate>
        <p id="otpMsg"></p>
        <label>Enter OTP<input id="otp" inputmode="numeric" maxlength="4" autocomplete="one-time-code"></label>
        <p class="err" role="alert"></p>
        <button class="btn">Verify</button>
        <p class="links"><button type="button" class="lnk" id="resend">Resend OTP</button></p>
      </form>
    </section>

    <section data-v="forgot" class="card" hidden>
      <h1>Forgot password</h1>
      <form id="fForgot" class="body" novalidate>
        <label>ID<input id="fId"></label>
        <label>Last name<input id="fLn"></label>
        <p class="err" role="alert"></p>
        <button class="btn">Send OTP</button>
      </form>
    </section>

    <section data-v="reset" class="card" hidden>
      <h1>Set new password</h1>
      <form id="fReset" class="body" novalidate>
        <label>New password (at least 8 characters)<input id="rW" type="password" autocomplete="new-password"></label>
        <label>Confirm new password<input id="rW2" type="password" autocomplete="new-password"></label>
        <p class="err" role="alert"></p>
        <button class="btn">Save password</button>
      </form>
    </section>

    <section data-v="welcome" class="card" hidden>
      <h1>Signed in</h1>
      <div class="body">
        <p>Welcome, <strong id="wName"></strong>.</p>
        <p class="sub" id="wRole"></p>
        <button type="button" class="btn" data-go="choose">Log out</button>
      </div>
    </section>
  </main>

  <footer class="foot">Safe Land portal</footer>
</div>

<script src="storage.js"></script>
<script>
(async()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S=LantStore;
let ctx={},otpOk=null,otpBack='user',flashMsg='',cur='choose';
await S.ready;
const err=(f,m)=>{f.querySelector('.err').textContent=m};
const mask=p=>'*'.repeat(Math.max(p.length-3,0))+p.slice(-3);

function show(v){
  cur=v;
  $$('[data-v]').forEach(s=>s.hidden=s.dataset.v!==v);
  $$('.err').forEach(x=>x.textContent='');
  const f=$('#flash');f.textContent=flashMsg;f.hidden=!flashMsg||!['choose','user','corp'].includes(v);
  scrollTo(0,0);
}
function showIntro(){$('#portal').hidden=true;$('#intro').hidden=false}
function askOtp(phone,ok,back){otpOk=ok;otpBack=back;ctx.phone=phone;$('#otpMsg').textContent='An OTP has been sent to '+mask(phone)+'.';$('#otp').value='';show('otp');$('#otp').focus()}
function welcome(name,role){flashMsg='';$('#wName').textContent=name;$('#wRole').textContent=role;show('welcome')}

$('#enter').onclick=()=>{$('#intro').hidden=true;$('#portal').hidden=false;show('choose')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go)});
const parent={choose:'intro',user:'choose',signup:'user',corp:'choose',forgot:'user',reset:'forgot',welcome:'choose'};
$('#back').onclick=()=>{const v=cur==='otp'?otpBack:parent[cur];v==='intro'?showIntro():show(v)};
$('#resend').onclick=()=>{err($('#fOtp'),'');$('#otpMsg').textContent='A new OTP has been sent to '+mask(ctx.phone)+'.'};

$('#fUser').onsubmit=async e=>{e.preventDefault();
  const id=$('#uId').value.trim(),u=S.user(id);
  if(!u||u.h!==await S.hash(id,$('#uPw').value)){S.log('user login',id,false);return err(e.target,'ID or password is incorrect.')}
  askOtp(u.phone,()=>{S.log('user login',id,true);welcome(u.first+' '+u.last,'User account')},'user');
};
$('#fCorp').onsubmit=async e=>{e.preventDefault();
  const id=$('#cId').value.trim(),u=S.corp(id);
  if(!u||u.h!==await S.hash(id,$('#cPw').value)){S.log('corporate login',id,false);return err(e.target,'ID or password is incorrect.')}
  askOtp(u.phone,()=>{S.log('corporate login',id,true);S.setSession('corp',id,u.name);location.href='corporate.html'},'corp');
};
$('#fSign').onsubmit=e=>{e.preventDefault();
  const g=i=>$(i).value.trim(),f=e.target,first=g('#sF'),last=g('#sL'),nid=g('#sN'),ph=g('#sP'),pw=$('#sW').value,pw2=$('#sW2').value;
  if(!first||!last)return err(f,'Enter your first and last name.');
  if(!/^\d{10,17}$/.test(nid))return err(f,'NID number must be 10 to 17 digits.');
  if(!/^\+?\d{10,15}$/.test(ph))return err(f,'Enter a valid phone number.');
  if(pw.length<8)return err(f,'Password must be at least 8 characters.');
  if(pw!==pw2)return err(f,'Passwords do not match.');
  if(S.user(nid))return err(f,'An account with this NID number already exists.');
  askOtp(ph,async()=>{
    await S.addUser(nid,{first,last,phone:ph,pw});
    flashMsg='Account created. Log in with your NID number and password.';
    f.reset();showIntro();
  },'signup');
};
$('#fOtp').onsubmit=e=>{e.preventDefault();
  if(!S.checkOtp($('#otp').value.trim()))return err(e.target,'Incorrect OTP. Please try again.');
  otpOk();
};
$('#fForgot').onsubmit=e=>{e.preventDefault();
  const id=$('#fId').value.trim(),u=S.user(id);
  if(!u||u.last.toLowerCase()!==$('#fLn').value.trim().toLowerCase())return err(e.target,'ID and last name do not match our records.');
  ctx.tid=id;askOtp(u.phone,()=>show('reset'),'forgot');
};
$('#fReset').onsubmit=async e=>{e.preventDefault();
  const p=$('#rW').value,p2=$('#rW2').value;
  if(p.length<8)return err(e.target,'Password must be at least 8 characters.');
  if(p!==p2)return err(e.target,'Passwords do not match.');
  await S.setPassword(ctx.tid,p);
  flashMsg='Password updated. Log in with your new password.';
  e.target.reset();show('user');
};
if(location.hash==='#login')$('#enter').click();
})();
</script>
</body>
</html>
